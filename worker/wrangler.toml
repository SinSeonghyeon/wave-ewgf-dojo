# Cloudflare Worker for the weekly leaderboard, visit counter and message board. Deploy from this folder: npx wrangler deploy
name = "mishima-dojo-board"
main = "index.js"
compatibility_date = "2025-09-01"

# Browser origins allowed to call the API (comma-separated, no trailing slash). Add a custom domain here when one is connected.
# Anything else gets no CORS headers and 403 on POST, so copies of the page cannot use the leaderboard/posts/visits.
[vars]
ALLOWED_ORIGINS = "https://mishimaryu.com, https://www.mishimaryu.com, https://sinseonghyeon.github.io"

[[d1_databases]]
binding = "DB"
database_name = "mishima-dojo-board"
# id of the live D1 (from `npx wrangler d1 create mishima-dojo-board`). Replace only when rebuilding on a new account.
database_id = "c0d67c02-7449-4a4e-9d56-60ef07f3418e"

# Per-IP limit for POST /posts (3 per minute). Optional: the Worker skips the check when the binding is absent.
[[ratelimits]]
name = "POST_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Per-IP limit for POST /nick (10 per minute): stops bulk nickname squatting.
[[ratelimits]]
name = "NICK_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Secrets (not in this file): ADMIN_TOKEN unlocks every admin route (delete posts/scores, shadow bans, whole-week score listing) → npx wrangler secret put ADMIN_TOKEN
