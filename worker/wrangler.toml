# Cloudflare Worker for the weekly leaderboard. Deploy from this folder: npx wrangler deploy
name = "mishima-dojo-board"
main = "index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "mishima-dojo-board"
# id of the live D1 (from `npx wrangler d1 create mishima-dojo-board`). Replace only when rebuilding on a new account.
database_id = "c0d67c02-7449-4a4e-9d56-60ef07f3418e"
